# Pushing a tag like v0.1.0 builds both desktop apps (desktop.yml) and publishes them
# as a GitHub Release. The installed apps update themselves from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BladeNotes-* --repo "$GITHUB_REPOSITORY" --title "Blade Notes $GITHUB_REF_NAME" --generate-notes
